name: Link checker

on:
  push:
    branches: [master, "repo-refresh-*"]
  pull_request:
    branches: [master]
  schedule:
    - cron: "0 6 * * 1"  # Every Monday at 6am UTC

jobs:
  check-links:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Check links
        uses: lycheeverse/lychee-action@e7477775783ea5526144ba13e8db5eec57747ce8 # v2.9.0
        with:
          args: --no-progress --exclude "localhost" --exclude "LINK_TBD" --exclude "aka.ms" --exclude "foundershub.startups.microsoft.com" '**/*.md' # DevSkim: ignore DS162092
          fail: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}